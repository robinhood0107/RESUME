<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">주술사, 미국주식 모의투자 구조도</title>
<desc id="desc">저장소 README와 현재 코드의 주요 모듈 및 연결 경계를 요약한 구조도입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="white"/>
<text x="35" y="43" font-size="28" font-family="sans-serif" font-weight="700" fill="#111827">주술사, 미국주식 모의투자</text>
<path d="M600 230 V292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H302 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H897 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="85" width="600" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="125" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">Next.js 프론트엔드, 팀원 담당</text>
<text x="322" y="165" font-size="20" fill="#334155" font-family="sans-serif">종목 차트, 주문, 포트폴리오, 상담</text>
<text x="322" y="199" font-size="20" fill="#334155" font-family="sans-serif">REST 요청과 STOMP 구독</text>
<rect x="300" y="300" width="600" height="170" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="340" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">Spring Boot, Java 21</text>
<text x="322" y="380" font-size="20" fill="#334155" font-family="sans-serif">시세 조회는 거래 트랜잭션 밖</text>
<text x="322" y="414" font-size="20" fill="#334155" font-family="sans-serif">주문, 지갑, 보유 종목, 이력을 함께 변경</text>
<rect x="30" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">외부 시세, 별도 FastAPI 서버</text>
<text x="52" y="640" font-size="20" fill="#334155" font-family="sans-serif">Finnhub REST / WebSocket 시세</text>
<text x="52" y="674" font-size="20" fill="#334155" font-family="sans-serif">AI Gateway는 별도 저장소, 프로세스</text>
<rect x="625" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="647" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">PostgreSQL, Redis</text>
<text x="647" y="640" font-size="20" fill="#334155" font-family="sans-serif">지갑, 보유 종목 잠금 / 거래 이력</text>
<text x="647" y="674" font-size="20" fill="#334155" font-family="sans-serif">Redis 시세 캐시 → WebSocket 전달</text>
<text x="35" y="790" font-family="sans-serif" font-size="17" fill="#64748b">README, 현재 코드 기준 요약, 배포, 외부 서비스 실행 여부는 본문 검증 범위에 별도 표시</text>
</svg>
