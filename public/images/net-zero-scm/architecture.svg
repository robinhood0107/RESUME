<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Net Zero Smart SCM 구조도</title>
<desc id="desc">웹과 콘솔의 주요 구성 관계를 나타낸 구조도입니다. 연결선은 공통 처리 순서를 뜻하지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="white"/>
<text x="35" y="43" font-size="28" font-family="sans-serif" font-weight="700" fill="#111827">Net Zero Smart SCM</text>
<path d="M600 230 V292" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M600 470 V510 H302 V552" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M600 470 V510 H897 V552" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="300" y="85" width="600" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="125" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">Java 콘솔, 웹 화면</text>
<text x="322" y="165" font-size="20" fill="#334155" font-family="sans-serif">공급사, 프로젝트, 발주, 재고 조회</text>
<text x="322" y="199" font-size="20" fill="#334155" font-family="sans-serif">웹과 콘솔은 각각 DB에 접근</text>
<rect x="300" y="300" width="600" height="170" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="340" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">웹 서비스, 콘솔 DAO</text>
<text x="322" y="380" font-size="20" fill="#334155" font-family="sans-serif">웹: Controller → Service → Repository</text>
<text x="322" y="414" font-size="20" fill="#334155" font-family="sans-serif">콘솔: 메뉴 → DAO, 공용 DB</text>
<rect x="30" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">업무 단위 처리</text>
<text x="52" y="640" font-size="20" fill="#334155" font-family="sans-serif">발주서 → 품목 → 초기 납품 → 재고</text>
<text x="52" y="674" font-size="20" fill="#334155" font-family="sans-serif">UPSERT, SQLSTATE별 오류 처리</text>
<rect x="625" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="647" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">PostgreSQL</text>
<text x="647" y="640" font-size="20" fill="#334155" font-family="sans-serif">공급사, 부품, 발주, 납품, 창고 관계</text>
<text x="647" y="674" font-size="20" fill="#334155" font-family="sans-serif">FK, CHECK, 복합키, 탄소배출 자료</text>
<text x="35" y="790" font-family="sans-serif" font-size="17" fill="#64748b">README, 현재 코드 기준 요약, 배포, 외부 서비스 실행 여부는 본문 검증 범위에 별도 표시</text>
</svg>
