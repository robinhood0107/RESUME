- layout: left
  title: AI Trading Coach with User-Defined Risk Rules
  sub_title: Three-person capstone · PM / Decision Platform
  caption: May 2026 – Oct 2026
  link: https://github.com/robinhood0107/Capstone-AI-Trading-Coach
  link_text: GitHub
  description: |
    * Requiring both the rules and model to say BUY left over half of offline sessions without a candidate. I changed the flow to rule-proposed candidates with a model SELL veto.
    * Compared six combinations on the same 31 stocks and 5,362 sessions: no-candidate rate fell from 51.8% to 1.4%. I implemented the rule and added regression tests.
    * Mock-order tests covered submission, fills, balance updates and duplicate prevention after user and safety checks.
    * Separated financial sources, revisions, chunks and embeddings in PostgreSQL, with public/private retrieval and citation checks.
    * Teammates owned LSTM training, the Return Engine and dashboard UX.
- layout: left
  title: Document and Image Translation Pipeline
  sub_title: Personal open-source maintenance fork
  caption: Apr 2026 – Present
  link: https://github.com/robinhood0107/document-translate-myfix
  link_text: GitHub
  description: |
    * Added local HunyuanOCR, PaddleOCR-VL and Gemma paths to comic-translate.
    * Direct model requests cut OCR wall time from 60.2 to 8.3 seconds on the same six Japanese pages and 73 text regions; the final normalized OCR results matched.
    * Stage caching reuses matching input, model and settings. A two-page first run plus identical rerun took 279.9 seconds without caching and 156.0 seconds with it.
