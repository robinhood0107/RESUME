<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">FPGA 모스부호 송수신기 구조도</title>
<desc id="desc">저장소 README와 현재 코드의 주요 모듈 및 연결 경계를 요약한 구조도입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="white"/>
<text x="35" y="43" font-size="28" font-family="sans-serif" font-weight="700" fill="#111827">FPGA 모스부호 송수신기</text>
<path d="M600 230 V292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H302 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H897 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="85" width="600" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="125" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">버튼, 스위치, 보드 클록</text>
<text x="322" y="165" font-size="20" fill="#334155" font-family="sans-serif">모드 / 리셋 / 문자 선택 / 점, 선 입력</text>
<text x="322" y="199" font-size="20" fill="#334155" font-family="sans-serif">수신은 누름 시간이 아닌 점, 선 버튼 방식</text>
<rect x="300" y="300" width="600" height="170" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="340" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">Verilog Top, 클록 분주</text>
<text x="322" y="380" font-size="20" fill="#334155" font-family="sans-serif">TX / RX enable과 출력 배선</text>
<text x="322" y="414" font-size="20" fill="#334155" font-family="sans-serif">클록마다 레지스터 상태를 갱신</text>
<rect x="30" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">TX, RX 모듈</text>
<text x="52" y="640" font-size="20" fill="#334155" font-family="sans-serif">문자 버퍼, 시간 패턴 / 심볼, 길이</text>
<text x="52" y="674" font-size="20" fill="#334155" font-family="sans-serif">송신 순환, 저장 / A–Z 수신 해독</text>
<rect x="625" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="647" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">표시 드라이버</text>
<text x="647" y="640" font-size="20" fill="#334155" font-family="sans-serif">LED, 7-segment, LCD, 버저</text>
<text x="647" y="674" font-size="20" fill="#334155" font-family="sans-serif">논리 시뮬레이션과 보드 실기를 구분</text>
<text x="35" y="790" font-family="sans-serif" font-size="17" fill="#64748b">README, 현재 코드 기준 요약, 배포, 외부 서비스 실행 여부는 본문 검증 범위에 별도 표시</text>
</svg>
