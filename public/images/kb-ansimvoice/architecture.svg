<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">KB 안심보이스, 머니룰 구조도</title>
<desc id="desc">저장소 README와 현재 코드의 주요 모듈 및 연결 경계를 요약한 구조도입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="white"/>
<text x="35" y="43" font-size="28" font-family="sans-serif" font-weight="700" fill="#111827">KB 안심보이스, 머니룰</text>
<path d="M600 230 V292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H302 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H897 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="85" width="600" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="125" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">고객, 보호자, 운영자 화면</text>
<text x="322" y="165" font-size="20" fill="#334155" font-family="sans-serif">음성, 텍스트 입력 / 거래 복창 확인</text>
<text x="322" y="199" font-size="20" fill="#334155" font-family="sans-serif">추가 확인, 중단 이유 안내</text>
<rect x="300" y="300" width="600" height="170" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="340" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">FastAPI, 제한형 Agent</text>
<text x="322" y="380" font-size="20" fill="#334155" font-family="sans-serif">거래 초안 → 원문 재대조 → 규칙 판정</text>
<text x="322" y="414" font-size="20" fill="#334155" font-family="sans-serif">모델 해석과 실행 권한을 분리</text>
<rect x="30" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">음성, 설명, 사례 검색</text>
<text x="52" y="640" font-size="20" fill="#334155" font-family="sans-serif">STT / TTS, WebSocket, 기본 안내</text>
<text x="52" y="674" font-size="20" fill="#334155" font-family="sans-serif">모델 실패 때도 규칙 검사를 유지</text>
<rect x="625" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="647" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">머니룰, 일회용 승인, 모의 금융</text>
<text x="647" y="640" font-size="20" fill="#334155" font-family="sans-serif">금액, 수취인, 목적, 시간, 확인자 조건</text>
<text x="647" y="674" font-size="20" fill="#334155" font-family="sans-serif">승인을 거래 한 건에 묶고 감사 기록</text>
<text x="35" y="790" font-family="sans-serif" font-size="17" fill="#64748b">README, 현재 코드 기준 요약, 배포, 외부 서비스 실행 여부는 본문 검증 범위에 별도 표시</text>
</svg>
