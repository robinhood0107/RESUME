<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">PromptAirlock, 보안 중계 Gateway 구조도</title>
<desc id="desc">저장소 README와 현재 코드의 주요 모듈 및 연결 경계를 요약한 구조도입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="white"/>
<text x="35" y="43" font-size="28" font-family="sans-serif" font-weight="700" fill="#111827">PromptAirlock, 보안 중계 Gateway</text>
<path d="M600 230 V292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H302 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 470 V510 H897 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="85" width="600" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="125" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">기관 앱 → HTTPS 입구</text>
<text x="322" y="165" font-size="20" fill="#334155" font-family="sans-serif">출처 인증, 등급, JSON 검사, 고정 오류</text>
<text x="322" y="199" font-size="20" fill="#334155" font-family="sans-serif">Boost.Asio / Beast, OpenSSL</text>
<rect x="300" y="300" width="600" height="170" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="322" y="340" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">Pure Core, 단계 타입</text>
<text x="322" y="380" font-size="20" fill="#334155" font-family="sans-serif">Raw → PolicyChecked → Protected → Verified</text>
<text x="322" y="414" font-size="20" fill="#334155" font-family="sans-serif">정책, 치환, 잔여 검사, 복원 계획</text>
<rect x="30" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">탐지, NER, provider 경계</text>
<text x="52" y="640" font-size="20" fill="#334155" font-family="sans-serif">규칙, 정규화, 위치 역매핑, ONNX NER</text>
<text x="52" y="674" font-size="20" fill="#334155" font-family="sans-serif">VerifiedPrompt만 전송 / 현재 모의 provider 검증</text>
<rect x="625" y="560" width="545" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="647" y="600" font-size="23" font-weight="700" fill="#0f172a" font-family="sans-serif">별도 Vault, 로컬 감사</text>
<text x="647" y="640" font-size="20" fill="#334155" font-family="sans-serif">Named Pipe / UDS + Protobuf, 범위별 mapping</text>
<text x="647" y="674" font-size="20" fill="#334155" font-family="sans-serif">TTL, 정확 복원, 정리 / 로컬 해시 연결 기록</text>
<text x="35" y="790" font-family="sans-serif" font-size="17" fill="#64748b">README, 현재 코드 기준 요약, 배포, 외부 서비스 실행 여부는 본문 검증 범위에 별도 표시</text>
</svg>
