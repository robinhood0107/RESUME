- layout: left
  title: 투자 원칙 검증형 AI Trading Coach
  sub_title: 3인 졸업과제 · PM / Decision Platform
  caption: 2026.05 ~ 2026.10
  link: https://github.com/robinhood0107/Capstone-AI-Trading-Coach
  link_text: GitHub
  description: |
    * 초기에는 투자 규칙과 모델이 모두 매수를 내야 후보가 생겨 평가 세션의 절반 이상이 비었습니다. 규칙이 후보를 만들고 모델의 매도 신호가 제외하도록 바꿨습니다.
    * 동일 31종목·5,362개 오프라인 평가 세션에서 결합 방식 6개를 비교해 후보가 없는 비율을 51.8%에서 1.4%로 낮췄습니다. 변경한 규칙을 코드와 회귀 테스트에 반영했습니다.
    * 주문 전에 사용자 원칙과 시스템 규칙을 검사하고, 모의주문 시나리오에서 주문·체결·잔고 반영과 중복 제출 방지를 검증했습니다.
    * 금융 자료의 원본·개정본·검색 조각·임베딩을 PostgreSQL에 나누어 저장했습니다. 공개·개인 자료의 검색 권한과 인용·숫자 확인을 구현했습니다.
    * LSTM 학습·Return Engine·대시보드 UX는 팀원이 맡았습니다.
